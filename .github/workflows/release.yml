name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: '只构建/校验, 不发布'
        type: boolean
        default: true

# npm Trusted Publishing (OIDC) + provenance 需要 id-token: write.
# contents: write 用于打 tag 后创建 GitHub Release（跳过发布时也照样建）。
permissions:
  contents: write
  id-token: write

# 发布不可并发: 同 ref 排队而非取消.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # 需在仓库 Settings → Environments 里建 "npm" 环境 (建议配 required reviewers).
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `gh release create --generate-notes` 需要历史与既有 tag 才能算变更集。
          fetch-depth: 0

      - name: Guard — 发布来源与版本号
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${{ github.event_name }}" = "push" ]; then
            test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
          else
            # 手工发布只允许 main, 防止在历史提交/分支上误发.
            test "${GITHUB_REF_NAME}" = "main" || { echo "workflow_dispatch 只允许在 main 上发布 (当前 ${GITHUB_REF_NAME})"; exit 1; }
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Trusted Publishing (OIDC) 需要 npm CLI ≥ 11.5.1；Node 24 自带 npm 11。
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure npm CLI supports trusted publishing
        run: npm install -g npm@latest && npm --version

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:ci
      - run: bun run build
      # 发布前的产物门禁: 完整入口可跑非 layered 算法 + layered 子入口可用 + 体积分层.
      - run: bun run smoke:pack

      # 版本已在 registry 时不再硬失败，而是跳过发布、只建 GitHub Release。
      # 这样两种情形都能走通：① 给历史版本补 tag（内容早已发布，重跑只会红）；
      # ② tag 推上去后才失败、需要重跑工作流。
      - name: 探测该版本是否已发布
        id: published
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "ggn-layout@${version}" version >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "ggn-layout@${version} 已在 registry —— 跳过 npm publish，只建 GitHub Release。"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        # dry-run 用一次性预发布版本号: npm 即使 --dry-run 也会去 registry 查重,
        # 若沿用 package.json 里已发布的版本, 演练必然以
        # "You cannot publish over the previously published versions" 收尾,
        # Actions 上永远是一条红的. 换成本次 run 独有、不可能存在的版本号后,
        # 演练能一路走完(含 registry 查询与 provenance 前置校验)且不产生任何残留.
        # 预发布版本号还必须显式给 --tag, 否则 npm 直接拒绝.
        run: |
          npm pkg set version="0.0.0-dryrun.${{ github.run_id }}"
          npm publish --dry-run --provenance --tag dryrun

      - name: Publish
        if: >-
          (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry-run == false))
          && steps.published.outputs.found == 'false'
        run: npm publish --provenance

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
