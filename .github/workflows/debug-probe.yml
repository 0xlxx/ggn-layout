name: debug-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: env
        run: uname -a && bun --version && node --version
      - name: probe
        run: bun tests/debug/mo-probe.ts
      - name: single test file (node/V8 runner)
        if: always()
        run: node ./node_modules/vitest/vitest.mjs run tests/unit/ModelOrderBarycenterHeuristicTest.test.ts 2>&1 | tail -25
      - name: single test file (bun/JSC runner)
        if: always()
        run: bun ./node_modules/vitest/vitest.mjs run tests/unit/ModelOrderBarycenterHeuristicTest.test.ts 2>&1 | tail -25
